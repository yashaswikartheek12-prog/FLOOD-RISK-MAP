<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flood Risk Map</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef3f1;--ink:#14302b;--muted:#5a726c;--panel:#ffffff;--line:#cfdcd8;--accent:#0b6e8a;
  --low:#dfeedd;--mid:#f2c14e;--high:#b3261e;--water:#2b7fb8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1e1b;--ink:#e3efec;--muted:#93aaa4;--panel:#172a26;--line:#2a423d;--accent:#5bc0de;
  --low:#25402f;--mid:#d9a93a;--high:#e5594f;--water:#3a8fcb;}}
:root[data-theme="dark"]{--bg:#0f1e1b;--ink:#e3efec;--muted:#93aaa4;--panel:#172a26;--line:#2a423d;--accent:#5bc0de;
  --low:#25402f;--mid:#d9a93a;--high:#e5594f;--water:#3a8fcb;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 1.7rem/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
p.sub{margin:0 0 18px;color:var(--muted);max-width:60ch}
.layout{display:grid;grid-template-columns:1fr 280px;gap:16px}
@media(max-width:760px){.layout{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
canvas{width:100%;height:auto;display:block;border-radius:6px;image-rendering:pixelated;cursor:crosshair}
label{display:block;font-weight:600;margin:0 0 4px}
input[type=range]{width:100%;accent-color:var(--accent)}
.row{margin-bottom:14px}
.val{color:var(--accent);font-weight:700}
button{font:inherit;font-weight:600;padding:9px 14px;border-radius:8px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;cursor:pointer;margin:0 6px 6px 0}
button.alt{background:transparent;color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--mid);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px;text-align:center}
.stats div{border:1px solid var(--line);border-radius:8px;padding:8px 4px}
.stats b{display:block;font-size:1.3rem}
.legend{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin-top:10px}
.bar{flex:1;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--low),var(--mid),var(--high))}
.sw{width:12px;height:12px;border-radius:3px;background:var(--water);display:inline-block}
#info{min-height:4.5em;font-size:.92rem}
</style>
</head>
<body>
<main>
  <h1>Flood Risk Map</h1>
  <p class="sub">Terrain, rainfall and land use go in. A flood risk score for every patch of land comes out. This is demo terrain: a river valley with hills on both sides.</p>
  <div class="layout">
    <div class="card">
      <canvas id="map" width="60" height="40" aria-label="Flood risk map"></canvas>
      <div class="legend"><span class="sw"></span>River <span style="margin-left:10px">Low</span><div class="bar"></div><span>High risk</span></div>
    </div>
    <div class="card">
      <div class="row"><label for="rain">Storm rainfall: <span class="val" id="rv">150</span> mm</label>
        <input id="rain" type="range" min="40" max="300" value="150"></div>
      <div class="row"><label for="urban">Built-up land: <span class="val" id="uv">30</span>%</label>
        <input id="urban" type="range" min="0" max="80" value="30"></div>
      <button id="run">Run analysis</button><button id="new" class="alt">New terrain</button>
      <div class="stats">
        <div><b id="sh">0</b>High</div><div><b id="sm">0</b>Medium</div><div><b id="sl">0</b>Low</div>
      </div>
      <div id="info">Click any spot on the map to see its elevation, land type and risk score.</div>
    </div>
  </div>
</main>
<script>
const W=60,H=40,LAND=["Water","Building","Vegetation","Crop","Bare ground"];
const COEF=[1.0,0.9,0.25,0.4,0.6];
let seed=42,cells=[];
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){return Math.sqrt(-2*Math.log(r()+1e-9))*Math.cos(2*Math.PI*r())}

function makeTerrain(){
  const r=rng(seed);cells=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const e=10+Math.abs(x-W/2)*0.8+2*Math.sin(y/5)+gauss(r)*0.6;
    cells.push({e,land:2,flow:0,risk:0,sink:false,u:r(),x,y});
  }
}
function assignLand(urbanPct){
  const p=urbanPct/100;
  for(const c of cells){
    if(c.e<11)c.land=0;
    else if(c.e<16)c.land=c.u<p*1.6?1:3;
    else if(c.e<22)c.land=c.u<p*0.6?1:(c.u<0.7?3:4);
    else c.land=2;
  }
}
function analyse(rain){
  const n=cells.length;
  for(const c of cells){c.flow=rain*COEF[c.land];c.sink=false}
  const order=[...cells.keys()].sort((a,b)=>cells[b].e-cells[a].e);
  for(const i of order){
    const c=cells[i];let best=-1,bs=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;
      const nx=c.x+dx,ny=c.y+dy;
      if(nx<0||ny<0||nx>=W||ny>=H)continue;
      const s=(c.e-cells[ny*W+nx].e)/((dx&&dy)?1.4142:1);
      if(s>bs){bs=s;best=ny*W+nx}
    }
    if(best>=0)cells[best].flow+=c.flow;else c.sink=true;
  }
  let mn=1e9,mx=-1e9,mf=0;
  for(const c of cells){mn=Math.min(mn,c.e);mx=Math.max(mx,c.e);mf=Math.max(mf,c.flow)}
  for(const c of cells){
    const low=1-(c.e-mn)/(mx-mn+1e-9);
    const fl=Math.log1p(c.flow)/Math.log1p(mf+1e-9);
    let r=0.35*low+0.45*fl+0.2*COEF[c.land];
    if(c.sink)r+=0.1;
    c.risk=Math.min(1,r);
  }
}
const cv=document.getElementById("map"),ctx=cv.getContext("2d");
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function hex(h){h=h.replace("#","");return[0,2,4].map(i=>parseInt(h.substr(i,2),16))}
function mix(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t))}
function draw(){
  const lo=hex(css("--low")),mi=hex(css("--mid")),hi=hex(css("--high")),wa=hex(css("--water"));
  const img=ctx.createImageData(W,H);
  let h=0,m=0,l=0;
  cells.forEach((c,i)=>{
    let col;
    if(c.land===0)col=wa;
    else{
      col=c.risk<0.5?mix(lo,mi,c.risk/0.5):mix(mi,hi,(c.risk-0.5)/0.5);
      if(c.risk>=0.66)h++;else if(c.risk>=0.4)m++;else l++;
    }
    img.data.set([...col,255],i*4);
  });
  ctx.putImageData(img,0,0);
  document.getElementById("sh").textContent=h;
  document.getElementById("sm").textContent=m;
  document.getElementById("sl").textContent=l;
}
function run(){
  assignLand(+document.getElementById("urban").value);
  analyse(+document.getElementById("rain").value);
  draw();
}
document.getElementById("rain").oninput=e=>{document.getElementById("rv").textContent=e.target.value;run()};
document.getElementById("urban").oninput=e=>{document.getElementById("uv").textContent=e.target.value;run()};
document.getElementById("run").onclick=run;
document.getElementById("new").onclick=()=>{seed=Math.floor(Math.random()*1e6);makeTerrain();run()};
cv.onclick=ev=>{
  const b=cv.getBoundingClientRect();
  const x=Math.min(W-1,Math.floor((ev.clientX-b.left)/b.width*W));
  const y=Math.min(H-1,Math.floor((ev.clientY-b.top)/b.height*H));
  const c=cells[y*W+x];
  const lvl=c.land===0?"River":c.risk>=0.66?"HIGH":c.risk>=0.4?"MEDIUM":"LOW";
  document.getElementById("info").innerHTML=
    `<b>Cell (${x}, ${y})</b><br>Elevation: ${c.e.toFixed(1)} m<br>Land: ${LAND[c.land]}<br>Risk score: ${c.risk.toFixed(2)} (${lvl})`;
};
makeTerrain();run();
</script>
</body>
</html>
